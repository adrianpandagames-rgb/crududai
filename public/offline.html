<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111827" />
  <title>Sin conexión · UDAI</title>
  <style>
    :root { color-scheme: light dark; --bg: #f3f5f8; --panel: #ffffff; --ink: #1f2937; --muted: #5b6878; --accent: #0d6efd; }
    @media (prefers-color-scheme: dark) { :root { --bg: #111827; --panel: #1f2937; --ink: #e5edf6; --muted: #aebed0; --accent: #8dc5ff; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { width: min(420px, 100%); padding: 32px 24px; border-radius: 16px; background: var(--panel); text-align: center;
      box-shadow: 0 12px 32px rgba(15, 23, 42, .15); }
    img { width: 96px; height: 96px; border-radius: 20px; }
    h1 { margin: 16px 0 8px; font-size: 1.35rem; }
    p { margin: 0 0 24px; color: var(--muted); }
    button { min-height: 44px; padding: 10px 24px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    @media (prefers-color-scheme: dark) { button { color: #0b1a2c; } }
    button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img src="/public/imgs/pwa/icon-192.png" alt="" />
    <h1>Sin conexión</h1>
    <p>No hay internet en este momento. Por seguridad, la información no se guarda en el dispositivo; vuelve a intentarlo cuando tengas conexión.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
  </main>
  <script>
    // Reload by itself as soon as the connection comes back.
    window.addEventListener('online', () => location.reload());
  </script>
</body>
</html>
